# 报告设定文件（阶段 0-1 产出，确认后锁定。如需修改，回到阶段 0-1 重做并重走后续流程）
report:
  title: ""                # 报告标题
  subtitle: ""             # 副标题
  topic: ""                # 选题方向
  motivation:              # 背景与业务问题
    background: ""
    business_problem: ""
    trigger_event: ""      # 触发事件
  audience:                # 目标受众
    primary: ""            # 管理层 / 执行层 / 外部客户
    secondary: []
  objectives:              # 报告目标
    - decision: ""         # 要支撑的决策
      question: ""         # 要回答的具体问题
  success_criteria:        # 成功标准
    goal: ""               # 总体目标
    arguments: []          # 论证拆解（含优先级与可忽略条件）
    required_conclusions: [] # 必要结论
  delivery:                # 交付形式
    format: []             # ppt / pdf / html
    ppt_pages: 0
    theme: ""
  scope:                   # 分析范围
    time: ""
    business_unit: ""
    geography: ""
  constraints:             # 时间与资源约束
    deadline: ""
    analyst_availability: ""
    data_availability: ""
  existing_materials:      # 已有资料与数据清单
    - name: ""
      type: ""            # 数据表 / 埋点 / 文档 / 访谈记录
      coverage: ""
      quality: ""         # 高 / 中 / 低 / 未知
  reader_context:          # 读者先验认知与立场
    known: ""              # 已知什么
    stance: ""             # 倾向什么
    persuasion: ""         # 被什么说服
  compliance:              # 禁区与合规约束
    cannot_quote: []
    cannot_conclude: []
  benchmark: ""            # 标杆参照（可选）